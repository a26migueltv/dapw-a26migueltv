<VirtualHost *:80>
    ServerName estatico.192-168-56-141.nip.io
    ServerAlias dimension.192-168-56-141.nip.io portfolio.192-168-56-141.nip.io
    DocumentRoot /var/www/estatico/

    <Directory /var/www/estatico/>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    CustomLog /var/log/apache2/estatico-access.log combined
    ErrorLog /var/log/apache2/estatico-error.log
</VirtualHost>
